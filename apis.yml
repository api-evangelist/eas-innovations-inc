aid: eas-innovations-inc
name: EAS Innovations Inc
description: >-
  EAS Innovations Inc operates ELEV8, an end-to-end, cloud-based dealer management
  system (DMS) built for independent auto dealers and automotive finance companies.
  The platform unifies real-time accounting, inventory management, CRM and desking,
  loan servicing, payments and collections into a single fully-integrated system.
  It offers per-seat pricing, user-based access rights, user-level audit logs,
  whitelisted IP addresses, multi-rooftop access and department-level restrictions,
  and is delivered as a SaaS web application at app.elev8dms.com. EAS Innovations
  is a 500 Global portfolio company. No public developer API is currently published.
